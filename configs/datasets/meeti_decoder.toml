DEBUG = false

task = "classification"
model = "medtsllm"

# history=512  patch=32  stride=16  (same window as the PTB-XL decoder config)
history_len = 512
pred_len = 512


[data]
dataset = "MEETI"
mode = "multivariate"
cols = "all"
normalize = true
step = 512


[training]
epochs = 20
batch_size = 16
optimizer = "adam"
learning_rate = 1e-4
dropout = 0.1
loss = "ce"

eval_metric = "accuracy"
eval_metric_direction = "max"


[datasets.MEETI]
version = "v1"
root = "data/MEETI"                    # where you unzipped MEETI.zip
mimic_ecg_root = "data/mimic-iv-ecg"   # PhysioNet MIMIC-IV-ECG root (real waveforms)
# "mimic"         -> real 12-lead waveform from MIMIC-IV-ECG (needs PhysioNet + wfdb)
# "text_features" -> SMOKE TEST ONLY: fake series from interpretation text; verifies
#                    the pipeline runs end-to-end before you have PhysioNet access.
signal_source = "text_features"
# --- where the data lives ---
meeti_root = "data/meeti"          # where MEETI.zip was unzipped
mimic_root = "data/mimic_ecg"      # where MIMIC-IV-ECG waveforms live (for "mimic")
# --- where the ECG SIGNAL comes from ---
# "synthetic": fake signals, ONLY to verify the pipeline runs (results are meaningless)
# "mimic":     real 12-lead waveforms from a MIMIC-IV-ECG download (real results)
signal_source = "synthetic"


[models.medtsllm]
d_model = 32
d_ff = 128
n_heads = 8
num_tokens = 1024
# concatenation preserves inter-lead relationships (good for 12-lead ECG).
covariate_mode = "concat"
embedding_downsample_mode = "linear"

[models.medtsllm.patching]
patch_len = 32
stride = 16

[models.medtsllm.prompting]
input_stats_dim = 0
input_stats_select = "all"
dataset = true
task = true
clip = true          # MEETI's clinical report text is injected per-record
input_stats = false
examples = false

# Legacy text-injection ablation (off).
class_prompts = false
class_prompts_path = ""
class_prompts_per_class = 3
class_prompts_sample = true
class_codes = ["NORM", "MI", "STTC", "CD", "HYP"]

# --- BiomedCoOp prototype head (faithful mechanism) ---
[models.medtsllm.biomedcoop]
enabled = true
class_prompts_path = ""        # "" -> built-in ECG templates
n_prompts = 16
pool = "mean"
tau = 2.0
kdsp_lambda = 1.0
sccm_lambda = 0.0

[models.medtsllm.llm]
enabled = true
# decoder-only backbone (this is the decoder-only variant)
llm = "meta-llama/Llama-2-7b-hf"
load_in_4bit = false
load_in_8bit = false
llm_layers = -1


[setup]
seed = 0
device = "auto"
dtype = "mixed"
num_workers = "auto"
logger = "print"
